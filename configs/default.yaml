seed: 42

data:
  root: data/derm7pt
  image_type: derm        # derm (dermoscopic) | clinic (clinical photograph)
  image_size: 224
  num_workers: 4

model:
  backbone: resnet50      # torchvision backbone for the concept model x -> c
  pretrained: true
  label_hidden: 0         # 0 = linear c -> y; >0 = MLP hidden size

train:
  regime: joint           # independent | sequential | joint
  batch_size: 32
  epochs: 50
  lr: 1.0e-4
  weight_decay: 1.0e-4
  concept_loss_weight: 1.0   # lambda in joint training: L_y + lambda * L_c
  early_stopping_patience: 10

output_dir: results
